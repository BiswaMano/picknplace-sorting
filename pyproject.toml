[project]
name = "vla-autoparts"
version = "0.1.0"
description = "VLA model for automotive parts recognition and sorting — QLoRA fine-tuned Mini-InternVL-4B with custom action head"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    # Image processing & augmentation
    "pillow>=10.0.0",
    "albumentations>=1.4.0",
    "opencv-python>=4.9.0",
    # Data & serialization
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "jsonlines>=4.0.0",
    # Dataset acquisition
    "roboflow>=1.1.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    # UI — annotation tool + demo
    "gradio>=4.26.0",
    # Utilities
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "einops>=0.7.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.6.0",
]

[project.scripts]
vla-annotate = "src.dataset.annotator:main"
vla-pipeline = "src.dataset.pipeline:main"
vla-train = "src.training.trainer:main"
vla-eval = "src.eval.benchmark:main"
vla-demo = "demo.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "demo"]
